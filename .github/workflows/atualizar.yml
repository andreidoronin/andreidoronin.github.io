name: Atualizar currículo Lattes

on:
  push:
    paths:
      - "curriculo_lattes_limpo.xml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerar dados do currículo
        run: python atualizar_curriculo.py

      - name: Salvar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados_lattes.json
          git diff --cached --quiet || git commit -m "Atualiza dados do Lattes"
          git push
